<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookplate · Read it later · Eden Apps</title>
<meta name="description" content="A calm reading library kept on your own device. Import articles and text, read them offline in a clean reader, or have them read aloud. Nothing leaves your device.">
<meta name="eden-product" content="bookplate">
<meta name="eden-appname" content="Bookplate">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234338ca' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z'/><path d='M8 7h6M8 10h6'/></svg>">
<style>
  :root{
    --bg:#f6f6f9; --panel:#ffffff; --ink:#14152a; --faint:#6b6d84; --line:#e7e7ef;
    --acc:#4338ca; --acc-soft:#eef0fd; --ok:#0f9d58; --warn:#b4690e;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#0c0d12; --panel:#15161e; --ink:#f0f1f6; --faint:#9a9cb0; --line:#262838;
      --acc:#8b83f0; --acc-soft:#1c1d33; --ok:#3ec07a; --warn:#e0a244;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .app{max-width:1120px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--acc),#9333ea);display:inline-block}
  .brand-icon{width:26px;height:26px;border-radius:7px;display:block}
  .brand-name{font-weight:750;font-size:17px;letter-spacing:-.2px}
  .brand-tag{color:var(--faint);font-size:13.5px}
  @media(max-width:600px){.brand-tag{display:none}}
  .chip{font-size:12.5px;color:var(--acc);background:var(--acc-soft);padding:4px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
  .cols{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
  @media(max-width:760px){.cols{grid-template-columns:1fr}.reader-pane.hide-mobile{display:none}}

  .list-pane{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .add{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .add-row{display:flex;gap:8px}
  .btn{border:0;border-radius:9px;background:var(--acc);color:#fff;font-weight:650;font-size:13px;padding:8px 12px;cursor:pointer}
  .btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:default}
  .add textarea{width:100%;min-height:0;height:0;opacity:0;transition:height .15s,opacity .15s;border:1px solid var(--line);border-radius:9px;padding:0 10px;font:inherit;font-size:13.5px;background:var(--bg);color:var(--ink);resize:vertical}
  .add.expanded textarea{height:110px;opacity:1;padding:8px 10px}
  .add input.title{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13.5px;background:var(--bg);color:var(--ink);display:none}
  .add.expanded input.title{display:block}

  .tabs{display:flex;gap:4px;padding:8px 14px 0}
  .tab{border:0;background:none;color:var(--faint);font:inherit;font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px 8px 0 0;cursor:pointer}
  .tab.on{color:var(--acc);background:var(--acc-soft)}
  .list{flex:1;overflow:auto;padding:8px}
  .item{width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:11px 12px;cursor:pointer;display:block}
  .item:hover{background:var(--panel)}
  .item.sel{background:var(--panel);border-color:var(--line)}
  .item-title{font-weight:650;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item-meta{color:var(--faint);font-size:12px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item-date{color:var(--faint);font-size:11px;margin-top:5px}
  .empty{padding:36px 20px;text-align:center;color:var(--faint)}
  .empty-title{font-weight:700;color:var(--ink);font-size:16px;margin-bottom:6px}
  .empty-sub{font-size:13.5px;max-width:34ch;margin:0 auto}

  .reader-pane{display:flex;flex-direction:column;min-height:0}
  .reader-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .reader-bar .sp{flex:1}
  .reader-title{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reader-frame{flex:1;width:100%;border:0;background:var(--panel)}
  .icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 13px;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
  .icon-btn.warn{color:var(--warn)}
  .reader-empty{flex:1;display:grid;place-items:center;color:var(--faint);padding:24px;text-align:center}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center;z-index:20}
  .toast button{border:0;background:none;color:var(--acc);font:inherit;font-weight:700;cursor:pointer}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
  <div class="app" id="app"></div>
  <input type="file" id="picker" class="visually-hidden" accept=".html,.htm,.txt,text/html,text/plain">
  <script src="../vendor/readability.js"></script>
  <script type="module" src="../_license/gate.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
